appId: com.roman.hourfolio
---
# Goals tab: weekly goals and milestones, then editing a goal. Needs portfolio data.
- launchApp
- tapOn: '(Settings|Ustawienia|Налаштування)'
- tapOn: '.*English.*'
- tapOn: 'Goals'
- assertVisible: 'Milestones'
- takeScreenshot: 20-goals-en
- tapOn: '(Edit|Set) weekly goals'
- assertVisible: 'Weekly goals'
- tapOn: 'More: Guitar'
- takeScreenshot: 21-goals-edit-en
- tapOn: 'Done'
- assertVisible: 'This week'
- tapOn: '(Settings)'
- tapOn: '.*Українська.*'
- tapOn: 'Цілі'
- assertVisible: 'Віхи'
- takeScreenshot: 22-goals-uk
