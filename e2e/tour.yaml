appId: com.ms4ever7.hourfolio
---
# Visits the main screens with sample data and saves the README screenshots.
# Needs an onboarded app in English (run onboarding.yaml first). Replaces the data with samples.
- runFlow: connect.yaml
- tapOn:
    id: tab-profile
# Default look for the light screenshots; the dark ones are set further down.
- tapOn: '.*Appearance.*'
- tapOn: 'System'
- tapOn: '#6558F5'
- scrollUntilVisible:
    element: 'Plain'
    direction: DOWN
    centerElement: true
- tapOn: 'Plain'
- scrollUntilVisible:
    element: 'Back'
    direction: UP
- tapOn: 'Back'
- tapOn:
    id: profile-name
- eraseText
- inputText: 'Roman'
- hideKeyboard:
    optional: true
- scrollUntilVisible:
    element: 'Load sample data.*'
    direction: DOWN
    centerElement: true
- tapOn: 'Load sample data.*'
- tapOn: 'Continue'
- tapOn:
    id: tab-index
- scrollUntilVisible:
    element: 'Good (morning|afternoon|evening).*'
    direction: UP
- takeScreenshot: e2e/screenshots/10-today
# Scroll so the plan card, with today's sessions, fills the screen.
- scrollUntilVisible:
    element: 'Your hobbies'
    direction: DOWN
- takeScreenshot: e2e/screenshots/22-today-plan
# The Today card opens the day's entries (same as tapping it).
- openLink: hourfolio:///today
- runFlow:
    when:
      visible: 'Open'
    commands:
      - tapOn: 'Open'
- assertVisible: 'Add an entry'
- takeScreenshot: e2e/screenshots/26-today-modal
- tapOn: 'Done'
- scrollUntilVisible:
    element: 'Good (morning|afternoon|evening).*'
    direction: UP
- tapOn:
    id: tab-goals
- scrollUntilVisible:
    element: 'This week'
    direction: UP
- assertVisible: 'This week'
- takeScreenshot: e2e/screenshots/11-goals
- scrollUntilVisible:
    element: 'Edit plan'
    direction: DOWN
    centerElement: true
- takeScreenshot: e2e/screenshots/19-goals-plan
# "Edit plan" on Goals edits in place, so open the planner itself: it proposes the week straight away.
# Next week shows all seven days; free time is an option below the plan.
- openLink: hourfolio:///plan-week
- runFlow:
    when:
      visible: 'Open'
    commands:
      - tapOn: 'Open'
- assertVisible: 'Your week'
- tapOn: 'Next week'
- waitForAnimationToEnd
- takeScreenshot: e2e/screenshots/21-plan-result
- scrollUntilVisible:
    element: 'Adjust free time'
    direction: DOWN
- tapOn: 'Adjust free time'
- scrollUntilVisible:
    element: 'Free on weekends'
    direction: DOWN
    centerElement: true
- takeScreenshot: e2e/screenshots/20-plan-free
- tapOn: 'Save plan'
# Achievements: the shelf, one badge and the week it was earned in. The card sits between the goals and the plan.
- scrollUntilVisible:
    element: 'This week'
    direction: UP
- scrollUntilVisible:
    element:
      id: goals-achievements
    direction: DOWN
    centerElement: true
- tapOn:
    id: goals-achievements
- assertVisible: 'Badges'
- takeScreenshot: e2e/screenshots/23-achievements
# An earned badge: "Rest counts" when the sample weeks earned it, else the first badge, which every history has.
- runFlow:
    when:
      visible: 'Rest counts'
    commands:
      - tapOn: 'Rest counts'
- runFlow:
    when:
      notVisible: 'Badge · .*'
    commands:
      - tapOn: 'First hour logged'
- assertVisible: 'Badge · earned.*'
- takeScreenshot: e2e/screenshots/25-badge
- tapOn: 'Open that week'
- assertVisible: 'goals met'
- takeScreenshot: e2e/screenshots/24-week
- tapOn: 'Done'
- waitForAnimationToEnd
- tapOn: 'Done'
- waitForAnimationToEnd
- tapOn: 'Back'
- tapOn:
    id: tab-analytics
- assertVisible: 'Time allocation'
- takeScreenshot: e2e/screenshots/12-analytics
- tapOn:
    id: tab-index
- scrollUntilVisible:
    element: 'Guitar, all time'
    direction: DOWN
    centerElement: true
- tapOn: 'Guitar, all time'
- assertVisible: 'Capital · all time'
- takeScreenshot: e2e/screenshots/13-asset
- tapOn: 'Back'
- tapOn:
    id: tab-invest
- assertVisible: 'Invest time'
- takeScreenshot: e2e/screenshots/14-log
- swipe:
    start: '50%,15%'
    end: '50%,95%'
    duration: 300
- tapOn:
    id: tab-profile
- scrollUntilVisible:
    element: 'Change profile picture'
    direction: UP
- takeScreenshot: e2e/screenshots/15-profile
- tapOn: '.*Appearance.*'
- tapOn: 'Dark'
- tapOn: '#6558F5'
- scrollUntilVisible:
    element: 'Waves'
    direction: DOWN
    centerElement: true
- tapOn: 'Waves'
- scrollUntilVisible:
    element: 'Appearance'
    direction: UP
- takeScreenshot: e2e/screenshots/16-appearance-dark
- tapOn: 'Back'
- tapOn:
    id: tab-index
- scrollUntilVisible:
    element: 'Good (morning|afternoon|evening).*'
    direction: UP
- takeScreenshot: e2e/screenshots/17-today-dark
- tapOn:
    id: tab-goals
- scrollUntilVisible:
    element: 'Share my week'
    direction: UP
- tapOn: 'Share my week'
- assertVisible: 'Share my week'
- takeScreenshot: e2e/screenshots/18-share-week
- tapOn: 'Cancel'
