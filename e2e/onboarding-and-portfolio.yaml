appId: com.roman.hourfolio
---
# Onboarding in Ukrainian, then the main screens with sample data in English and Polish.
# Dev builds: clearState would also wipe the dev-client server choice, so start from a fresh install.
- launchApp
- runFlow:
    when:
      visible: 'This is the developer menu.*'
    commands:
      - tapOn: 'Continue'
- runFlow:
    when:
      visible: 'Runtime version.*'
    commands:
      - swipe:
          direction: DOWN
- assertVisible: 'Every hour you spend on yourself is an investment.'
- takeScreenshot: 01-welcome-en
- tapOn: '.*Українська.*'
- assertVisible: 'Кожна година для себе — це інвестиція.'
- takeScreenshot: 02-welcome-uk
- tapOn: 'Почати'
- assertVisible: 'У що ти інвестуєш свій час?'
- takeScreenshot: 03-pick-uk
- tapOn: 'Далі'
- assertVisible: 'Крок 2 з 2 · актив 1 з 9'
- tapOn: '.*Кілька разів на тиждень.*'
- tapOn: '.*200.*'
- takeScreenshot: 04-setup-uk
- tapOn: 'Решту налаштувати пізніше'
- assertVisible: 'Активи'
- takeScreenshot: 05-portfolio-empty-uk
- runFlow: portfolio-tour.yaml
